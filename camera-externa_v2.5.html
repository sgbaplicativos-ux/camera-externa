<!DOCTYPE html>
<!--
 MÓDULO OPCIONAL DE CÂMERA AO VIVO (PUBLICAR EM HOSPEDAGEM HTTPS SEPARADA).
 Google Apps Script HTMLService pode bloquear getUserMedia por Permissions Policy.
 Este HTML deve ser disponibilizado numa origem HTTPS (ex.: GitHub Pages institucional).
 Não recebe RE, token, SISPEC nem arquivo em servidor externo; somente envia a foto
 por postMessage à janela que abriu o módulo.

 Enquadramento verde: heurística luminosa para papel claro em FUNDO ESCURO.
 Não é reconhecimento documental nem garantia de integridade/legibilidade.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>Câmera de documentos • 1º SGB</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b101b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.camera{height:100dvh;display:flex;flex-direction:column}
.top{padding:17px 15px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.title{font-size:16px;font-weight:850}.desc{font-size:12px;color:#cbd5e1;margin-top:4px}.back{background:#263142;color:#fff;border:1px solid #475569;border-radius:10px;padding:11px 14px;font-size:12px;font-weight:800}
.stage{position:relative;flex:1;min-height:200px;overflow:hidden;background:#030712;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.shade{position:absolute;inset:0;background:#0004;pointer-events:none}
.frame{position:relative;width:min(82vw,calc(67dvh * .707));max-height:67dvh;aspect-ratio:0.707;border:4px solid #ef4444;border-radius:12px;box-shadow:0 0 0 999px #0003,0 0 18px #ef444455;transition:border-color .22s,box-shadow .22s;pointer-events:none}
.frame.good{border-color:#22c55e;box-shadow:0 0 0 999px #0002,0 0 24px #22c55e88}.cross{position:absolute;inset:12% 10%;border:1px dashed #ffffff60;border-radius:3px}
.lower{padding:13px 15px max(18px,env(safe-area-inset-bottom));background:#111827}.status{font-size:12px;color:#fda4af;font-weight:850;margin-bottom:11px;text-align:center;min-height:22px}.status.good{color:#86efac}
.capture{width:100%;min-height:52px;border:0;border-radius:13px;background:#ef4444;color:white;font-size:16px;font-weight:900;cursor:pointer}.capture:disabled{opacity:.4;cursor:not-allowed}.capture.good{background:#16a34a}
.tip{text-align:center;color:#cbd5e1;font-size:11px;line-height:1.45;margin-top:8px}
.error{position:absolute;left:12px;right:12px;top:40%;border:1px solid #fecaca;border-radius:14px;background:#fff;color:#991b1b;padding:18px;line-height:1.5;text-align:center;font-weight:750;font-size:13px}
</style>
</head>
<body>
<div class="camera">
 <div class="top"><div><div class="title" id="titulo">Fotografar a frente</div><div class="desc">Centralize a folha inteira no quadro. Aguarde ficar verde.</div></div><button class="back" id="cancelar">Voltar</button></div>
 <div class="stage" id="stage"><video id="video" autoplay playsinline muted></video><div class="shade"></div><div class="frame" id="frame"><div class="cross"></div></div><div class="error" id="erro" style="display:none"></div></div>
 <div class="lower"><div class="status" id="status">Preparando câmera...</div><button id="capturar" class="capture" disabled>Capturar foto</button><div class="tip">Use uma superfície escura e contraste com o papel. A detecção visual é aproximada e não substitui a conferência da foto.</div></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id),p=new URLSearchParams(location.search);
const etapa=p.get('etapa')==='verso'?'verso':'frente';
const nonce=p.get('nonce')||'';
const origem=p.get('origem')||'';
const origemAutorizada=/^https:\/\/(?:script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(origem);
let stream=null,estaveis=0,ativo=true,ultimo=0,emProcessamento=false;
$('titulo').textContent=etapa==='verso'?'Fotografar o verso':'Fotografar a frente';
const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d',{willReadFrequently:true});
function avisarFalha(){if(origemAutorizada && window.opener){window.opener.postMessage({tipo:'SGB_CAMERA_FALHA',nonce,etapa},origem);}}
function parar(){ativo=false;if(stream)for(const tr of stream.getTracks())tr.stop();stream=null;}
$('cancelar').onclick=()=>{parar();window.close();};
window.addEventListener('pagehide',parar);
function status(texto,ok){$('status').textContent=texto;$('status').classList.toggle('good',!!ok);$('frame').classList.toggle('good',!!ok);$('capturar').classList.toggle('good',!!ok);$('capturar').disabled=!ok;}
function falha(texto){$('erro').style.display='block';$('erro').textContent=texto+' Feche esta aba, permita o acesso à câmera e tente novamente.';status('Câmera indisponível',false);avisarFalha();parar();}
// Mapeia um pixel da tela de vídeo (object-fit: cover) para o vídeo original.
function parametrosVideo(){const vid=$('video'),box=$('stage').getBoundingClientRect();const vw=vid.videoWidth,vh=vid.videoHeight;
 if(!vw||!vh||!box.width||!box.height)return null;
 const scale=Math.max(box.width/vw,box.height/vh),sourceW=box.width/scale,sourceH=box.height/scale;
 return {box,vw,vh,sx:(vw-sourceW)/2,sy:(vh-sourceH)/2,sourceW,sourceH};}
function luminancia(data,idx){return (.2126*data[idx]+.7152*data[idx+1]+.0722*data[idx+2]);}
function testeEnquadramento(){const prm=parametrosVideo();if(!prm)return false;
 const largura=220,altura=Math.max(180,Math.round(largura*prm.box.height/prm.box.width));canvas.width=largura;canvas.height=altura;
 ctx.drawImage($('video'),prm.sx,prm.sy,prm.sourceW,prm.sourceH,0,0,largura,altura);
 const dados=ctx.getImageData(0,0,largura,altura).data,frame=$('frame').getBoundingClientRect();
 const xl=(frame.left-prm.box.left)/prm.box.width*largura,xr=(frame.right-prm.box.left)/prm.box.width*largura;
 const yt=(frame.top-prm.box.top)/prm.box.height*altura,yb=(frame.bottom-prm.box.top)/prm.box.height*altura;
 if(xl<4||yt<4||xr>=largura-4||yb>=altura-4)return false;
 // Amostra superfície FORA do quadro para estimar o fundo.
 const bg=[];
 for(let y=4;y<altura-4;y+=7){for(let x=4;x<largura-4;x+=7){
   if(x>xl-10&&x<xr+10&&y>yt-10&&y<yb+10)continue;
   bg.push(luminancia(dados,(y*largura+x)*4));
 }}
 if(bg.length<10)return false;bg.sort((a,b)=>a-b);const fundo=bg[Math.floor(bg.length/2)];
 const limite=Math.min(238,Math.max(98,fundo+28));if(fundo>197)return false;
 let minX=largura,maxX=0,minY=altura,maxY=0,quantidade=0,fora=0;
 // A foto do papel deve contrastar com o fundo e estar INTEIRA dentro do quadro.
 for(let y=2;y<altura-2;y+=2){for(let x=2;x<largura-2;x+=2){
   const l=luminancia(dados,(y*largura+x)*4);
   if(l<limite||l-fundo<22)continue;
   const dentro=(x>xl+3&&x<xr-3&&y>yt+3&&y<yb-3);
   if(dentro){quantidade++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}
   else if(x>xl-13&&x<xr+13&&y>yt-13&&y<yb+13)fora++;
 }}
 if(!quantidade||fora>Math.max(12,quantidade*.10))return false;
 const larguraObjeto=maxX-minX,alturaObjeto=maxY-minY;
 const larguraFrame=xr-xl,alturaFrame=yb-yt,proporcao=larguraObjeto/Math.max(1,alturaObjeto);
 const proporcaoPapel=larguraFrame/Math.max(1,alturaFrame);
 const ocupacao=quantidade/Math.max(1,(larguraObjeto/2)*(alturaObjeto/2));
 return larguraObjeto>larguraFrame*.64 && larguraObjeto<larguraFrame*.99 &&
        alturaObjeto>alturaFrame*.65 && alturaObjeto<alturaFrame*.99 &&
        proporcao>proporcaoPapel*.68 && proporcao<proporcaoPapel*1.4 &&
        ocupacao>.40 && quantidade>500;
}
async function iniciar(){if(!origemAutorizada||!/^[-0-9a-fA-F]{36}$/.test(nonce))return falha('Origem da solicitação inválida.');
 if(!navigator.mediaDevices?.getUserMedia)return falha('Este navegador não permite câmera ao vivo.');
 try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:960}}});
   $('video').srcObject=stream;await $('video').play();status('Ajuste a folha no quadro vermelho',false);requestAnimationFrame(analisar);
 }catch(e){falha('Permissão de câmera negada ou indisponível.');}}
function analisar(t){if(!ativo)return;requestAnimationFrame(analisar);if(t-ultimo<290||emProcessamento)return;ultimo=t;
 try{emProcessamento=true;const bom=testeEnquadramento();estaveis=bom?Math.min(5,estaveis+1):0;
   status(estaveis>=3?'Quadro verde • pode fotografar':'Alinhe a folha completa sobre fundo escuro',estaveis>=3);
 }catch(e){estaveis=0;status('Ajuste o documento e a iluminação',false);}finally{emProcessamento=false;}}
$('capturar').onclick=()=>{
 if(estaveis<3||!stream)return;
 if(!testeEnquadramento()){estaveis=0;status("Reposicione a folha no quadro",false);return;}
 try{const p=parametrosVideo(),f=$('frame').getBoundingClientRect();
  const sx=p.sx+(f.left-p.box.left)/p.box.width*p.sourceW;
  const sy=p.sy+(f.top-p.box.top)/p.box.height*p.sourceH;
  const sw=f.width/p.box.width*p.sourceW,sh=f.height/p.box.height*p.sourceH;
  const c=document.createElement('canvas');const mul=Math.min(1,1550/Math.max(sw,sh));c.width=Math.max(1,Math.round(sw*mul));c.height=Math.max(1,Math.round(sh*mul));
  const g=c.getContext('2d',{alpha:false});g.drawImage($('video'),sx,sy,sw,sh,0,0,c.width,c.height);
  let imagem=c.toDataURL('image/jpeg',.79);if(imagem.length>3900000)imagem=c.toDataURL('image/jpeg',.63);
  if(imagem.length>3900000)throw new Error('Imagem grande demais.');
  if(!window.opener)throw new Error('Janela de origem indisponível.');
  window.opener.postMessage({tipo:'SGB_CAMERA_FOTO',nonce,etapa,imagem},origem);parar();window.close();
 }catch(e){status('Falha ao capturar: tente novamente',false);}
};
iniciar();
</script>
</body>
</html>
