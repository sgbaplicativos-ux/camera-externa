<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teste da detecção da folha — V2.6</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;background:#09101d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100svh}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 16px;gap:18px}
h1{font-size:20px;margin:0 0 5px}p{margin:0;color:#b9c6d7;font-size:14px}
main{max-width:520px;margin:0 auto;padding:0 12px 36px}
#quadro{position:relative;width:100%;aspect-ratio:440/616;border:4px solid #ef4444;border-radius:16px;overflow:hidden;background:#080b11;box-shadow:0 0 0 2px #152030;transition:border-color .15s}
#quadro.valido{border-color:#22c55e;box-shadow:0 0 0 2px #166534}
video{display:block;width:100%;height:100%;object-fit:cover}
#guia{position:absolute;inset:9% 10%;border:1px dashed #ffffff8a;pointer-events:none}
#estado{padding:14px 0;text-align:center;min-height:68px;color:#fecaca;font-weight:650;font-size:14px}
#estado.valido{color:#86efac}
button{border:0;border-radius:12px;background:#c12b28;color:white;font-weight:750;padding:15px;font-size:16px;width:100%;margin:5px 0;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
button.secundario{background:#263449;font-size:13px;padding:12px}
small{display:block;color:#94a3b8;text-align:center;line-height:1.5;margin-top:10px}
#foto{display:none;width:100%;margin:18px 0;border-radius:14px;border:1px solid #334155}
#diagnostico{font:12px ui-monospace,monospace;color:#94a3b8;text-align:center;min-height:30px;margin-top:6px}
</style>
</head>
<body>
<header><div><h1>Fotografar a frente</h1><p>Teste do reconhecimento V2.6</p></div><span style="color:#a5b4fc;font-size:12px">SGB · Teste local</span></header>
<main>
<div id="quadro"><video id="video" autoplay playsinline muted></video><div id="guia"></div></div>
<div id="estado" role="status">Iniciando a câmera…</div>
<button id="captura" disabled>Capturar foto</button>
<button id="manual" class="secundario">Capturar para revisão manual</button>
<div id="diagnostico"></div>
<img id="foto" alt="Prévia local da captura">
<small>Esta é uma página de TESTE. A foto não é enviada e não altera o sistema de documentos. Mantenha as quatro bordas visíveis; se a luz for insuficiente, a revisão manual continua disponível.</small>
</main>
<script src="./detector-folha-v2.6.js"></script>
<script>
(function(){'use strict';
const video=document.getElementById('video'),quadro=document.getElementById('quadro'),estado=document.getElementById('estado'),btn=document.getElementById('captura'),previa=document.getElementById('foto'),diag=document.getElementById('diagnostico');
let stream,monitor,liberado=false;
function capturar(){if(!stream) return;const c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);previa.src=c.toDataURL('image/jpeg',.88);previa.style.display='block';previa.scrollIntoView({behavior:'smooth',block:'center'});}
btn.onclick=()=>{if(liberado)capturar()};document.getElementById('manual').onclick=capturar;
async function iniciar(){try{
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw Error('Abra esta página por HTTPS no celular.');
stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1920}}});
video.srcObject=stream;await video.play();
monitor=SGBDetectorFolhaV26.criarMonitor(video,r=>{
liberado=r.estavel;quadro.classList.toggle('valido',liberado);estado.classList.toggle('valido',liberado);btn.disabled=!liberado;
estado.textContent=liberado?'Folha reconhecida! Pode capturar.':r.motivo;
diag.textContent='Contraste: '+(r.contrasteBordas??'-')+' · Confiança: '+r.confianca+'% · Quadros: '+r.amostrasValidas+'/5';
},{intervaloMs:250});
}catch(e){estado.textContent='Erro da câmera: '+e.message;}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&monitor)monitor.parar();else if(!document.hidden&&stream){monitor=SGBDetectorFolhaV26.criarMonitor(video,r=>{liberado=r.estavel;quadro.classList.toggle('valido',liberado);estado.textContent=r.motivo;estado.classList.toggle('valido',liberado);btn.disabled=!liberado;});}});
window.addEventListener('pagehide',()=>{monitor?.parar();stream?.getTracks().forEach(t=>t.stop())});
iniciar();
})();
</script>
</body>
</html>
